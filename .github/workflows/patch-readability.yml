name: One-time readability patch

on:
  push:
    paths:
      - '.github/workflows/patch-readability.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch index.html safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original_script = text[text.index('<script>'):]

          replacements = [
              (''' .philosophy-en{'''.lstrip(), '''.philosophy-en{'''),
          ]

          simple = [
              (''' .philosophy-en{\n font-size:11px;\n line-height:1.8;\n color:#999;\n margin-top:8px;\n letter-spacing:.2px\n}'''.lstrip(), '''.philosophy-en{\n font-size:13px;\n line-height:1.8;\n color:#666;\n margin-top:8px;\n letter-spacing:.2px\n}'''),
              ('''.card p{font-size:14px;color:#666}''', '''.card p{font-size:16px;color:#444}'''),
              ('''.registration p{\n position:relative;\n z-index:2;\n font-size:14px;\n color:#555\n}''', '''.registration p{\n position:relative;\n z-index:2;\n font-size:16px;\n color:#444\n}'''),
              ('''.small{\n font-size:12px;\n color:#777;\n line-height:1.8\n}''', '''.small{\n font-size:14px;\n color:#555;\n line-height:1.85\n}'''),
              ('''.rules p,.rules li{font-size:14px}''', '''.rules p,.rules li{font-size:16px;line-height:1.9}'''),
              ('''.application-box p,.application-box li{font-size:14px}''', '''.application-box p,.application-box li{font-size:16px;line-height:1.9}'''),
          ]

          for old, new in simple:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly 1 occurrence, found {count}: {old[:60]!r}')
              text = text.replace(old, new, 1)

          old_flow = '''<h3>登録までの流れ</h3>\n<ol>\n<li>抽選に申し込みます。</li>\n<li>発行された確認番号（AP番号）と受取キーを保管してください。</li>\n<li>抽選結果は、当資料室のWebサイト上でAP番号を入力して確認します。</li>\n<li>当選した方は、表示された申請期限までに専用の登録申請を行います。</li>\n<li>申請者自身が申請時に現物を撮影した画像を提出します。</li>\n<li>当資料室が提出された画像、資料関連情報その他必要な事項を確認します。</li>\n<li>必要に応じて、追加画像や追加情報の提出を求める場合があります。</li>\n<li>確認した内容に基づき、登録の可否及び登録区分を判断します。</li>\n<li>登録が決定した資料には登録番号を付与し、登録書を作成します。</li>\n<li>登録書は、AP番号と受取キーを使って専用ページから受け取ります。</li>\n</ol>'''

          new_flow = '''<h3>登録までの流れ</h3>\n<ol>\n<li>\n<strong>抽選申込み</strong><br>\n登録申請の抽選は月単位で受け付けます。<br>\n例：9月申込み、10月申込み<br>\n申込み完了後、確認番号（AP番号）と受取キーが発行されます。抽選結果の確認や登録書の受取りに必要となりますので、必ず保存してください。\n</li>\n<li>\n<strong>抽選結果の確認</strong><br>\n抽選結果は、申込み月の<strong>翌々月1日から</strong>確認できます。<br>\n例：9月申込み → 11月1日から確認可能<br>\n例：10月申込み → 12月1日から確認可能<br>\n抽選結果はメールでは通知されません。このHPの抽選結果確認口から、AP番号を入力して確認してください。\n</li>\n<li>\n<strong>当選後の登録申請</strong><br>\n当選した場合は、<strong>抽選発表日から60日以内</strong>に登録申請を行ってください。<br>\n申請期限を過ぎると、その当選による登録申請はできません。\n</li>\n<li>\n<strong>資料の登録</strong><br>\n提出された画像、資料関連情報その他必要な事項を確認し、登録の可否及び登録区分を判断します。必要に応じて、追加画像や追加情報の提出をお願いする場合があります。\n</li>\n<li>\n<strong>登録番号・登録書</strong><br>\n登録が決定した資料には登録番号を付与し、登録書を作成します。\n</li>\n<li>\n<strong>登録書の受取り</strong><br>\n登録完了後、<strong>このHPにある登録書の受取り口</strong>から登録書を受け取ることができます。<br>\n受取りには、申込み時に発行されたAP番号と受取キーを使用します。\n</li>\n</ol>'''

          count = text.count(old_flow)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 old flow block, found {count}')
          text = text.replace(old_flow, new_flow, 1)

          if text[text.index('<script>'):] != original_script:
              raise SystemExit('Safety check failed: script section changed')

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- index.html

      - name: Commit only index.html
        shell: bash
        run: |
          test -n "$(git status --porcelain index.html)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve application guidance and readability"
          git push origin HEAD:main
