name: Patch lottery result message
on:
  push:
    paths:
      - '.github/workflows/patch-lottery-result-message.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch-lottery-result-message.py
      - run: git diff --check
      - run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes" >&2
            exit 1
          fi
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show lottery result availability date"
          git push
