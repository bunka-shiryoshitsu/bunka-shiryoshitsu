name: Emphasize image help text
on:
  push:
    paths:
      - '.github/workflows/emphasize-image-help.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Emphasize image guidance only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old1='''   <p class="small">申請者自身が申請時に現物を撮影した画像をアップロードしてください。</p>'''
          new1='''   <p class="small" style="font-size:17px;font-weight:700;color:#111">申請者自身が申請時に現物を撮影した画像をアップロードしてください。</p>'''
          old2='''   <p class="small">\n    最大20枚まで提出できます。長辺が2,500pxを超える画像は、自動的に2,500px以内へ縮小します。\n   </p>'''
          new2='''   <p class="small" style="font-size:17px;font-weight:700;color:#111">\n    最大20枚まで提出できます。長辺が2,500pxを超える画像は、自動的に2,500px以内へ縮小します。\n   </p>'''
          if old1 not in s:
              raise SystemExit('first target not found')
          if old2 not in s:
              raise SystemExit('second target not found')
          s=s.replace(old1,new1,1).replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Emphasize image upload guidance"
          git push
