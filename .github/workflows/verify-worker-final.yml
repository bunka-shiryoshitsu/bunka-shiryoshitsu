name: Verify Worker final

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check all Worker JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for f in worker*.js; do
            echo "node --check $f"
            node --check "$f"
          done
      - name: Verify imports, no circular dependency, and core reachability
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const files = fs.readdirSync('.').filter(f => /^worker.*\.js$/.test(f));
          const set = new Set(files);
          const graph = new Map(files.map(f => [f, []]));
          const re = /(?:import|export)\s+(?:[^'";]*?\s+from\s+)?["'](\.\/[^"']+\.js)["']/g;
          for (const f of files) {
            const src = fs.readFileSync(f, 'utf8');
            let m;
            while ((m = re.exec(src))) {
              const target = path.posix.normalize(path.posix.join(path.posix.dirname(f), m[1])).replace(/^\.\//, '');
              if (!set.has(target)) throw new Error(`${f}: missing local import ${target}`);
              graph.get(f).push(target);
            }
          }
          const state = new Map();
          const stack = [];
          function dfs(n) {
            state.set(n, 1); stack.push(n);
            for (const v of graph.get(n) || []) {
              if (state.get(v) === 1) {
                const i = stack.indexOf(v);
                throw new Error('circular import: ' + [...stack.slice(i), v].join(' -> '));
              }
              if (!state.get(v)) dfs(v);
            }
            stack.pop(); state.set(n, 2);
          }
          for (const f of files) if (!state.get(f)) dfs(f);
          const seen = new Set();
          function walk(n) { if (seen.has(n)) return; seen.add(n); for (const v of graph.get(n) || []) walk(v); }
          walk('worker.js');
          for (const required of ['worker-dashboard9.js', 'worker-entry.js', 'worker-core.js']) {
            if (!seen.has(required)) throw new Error(`worker.js does not reach ${required}`);
          }
          const entry = fs.readFileSync('worker-entry.js','utf8');
          if (!entry.includes('from "./worker-core.js"') && !entry.includes("from './worker-core.js'")) {
            throw new Error('worker-entry.js is not wired to worker-core.js');
          }
          console.log(`PASS: ${files.length} Worker JS files; no missing imports; no circular imports; core reachable.`);
          NODE
      - name: Verify critical routes and final presentation policy
        shell: bash
        run: |
          set -euo pipefail
          for route in '/check' '/check-application' '/lottery-apply' '/image-upload' '/registration-submit' '/receive-status' '/receive-file' '/system/application-status' '/admin/review'; do
            grep -R -F --include='worker*.js' "$route" . >/dev/null || { echo "Missing critical route: $route"; exit 1; }
          done
          grep -F 'path.startsWith("/_dev/")' worker-dashboard9.js >/dev/null
          grep -F '抽選に申し込む / APPLY FOR LOTTERY' worker-dashboard9.js >/dev/null
          grep -F '登録書を確認 / CHECK' worker-dashboard9.js >/dev/null
          grep -F '再発行は行いません' worker-dashboard9.js >/dev/null
          grep -F '重複申込の可能性あり（手動当選可）' worker-dashboard9.js >/dev/null
          ! grep -R -F 'applicationIp' worker*.js
          ! grep -R -F '申請時IP' worker*.js
          echo 'PASS: critical routes and final presentation policy present.'
