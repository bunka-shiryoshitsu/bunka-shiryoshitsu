name: Assemble Worker source

on:
  push:
    branches: [main]
    paths:
      - 'worker_bundle/**'
      - '.github/workflows/assemble-worker.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and verify worker.js
        shell: bash
        run: |
          set -euo pipefail
          cat \
            worker_bundle/part_01a.b64 \
            worker_bundle/part_01b.b64 \
            worker_bundle/part_02.b64 \
            worker_bundle/part_03.b64 \
            worker_bundle/part_04.b64 \
            > worker.b64

          base64 -d worker.b64 > worker.js.gz
          gzip -dc worker.js.gz > worker.js

          echo 'db5851869d4349773568af86a1f0e157603b0d40ca58da938d1b5b53f90aba1d  worker.js' | sha256sum -c -
          node --check worker.js

      - name: Commit verified Worker and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf worker_bundle worker_parts
          rm -f worker.b64 worker.js.gz
          rm -f .github/workflows/assemble-worker.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi

          git commit -m 'Assemble verified Cloudflare Worker source'
          git push
