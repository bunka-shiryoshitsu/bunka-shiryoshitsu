name: Finalize public site integration v3

on:
  push:
    paths:
      - '.github/workflows/finalize-index-v3.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and validate index
        run: |
          python scripts/finalize_index.py
          node --check /tmp/index-script.js
      - name: Commit finalized index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize public registration flow'
          git push
