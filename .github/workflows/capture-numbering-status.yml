name: Capture numbering verification status

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch production status
        shell: bash
        run: |
          set -euo pipefail
          URL='https://bunka-shiryoshitsu-checksoft-mountain-b5a9.08084947685jddhdj.workers.dev/_cutover/status-html/8d4363f185249d89cd7bfebe6d903be3d1e679c8ae21bee3'
          curl -fsSL "$URL" -o /tmp/status.html
          python - <<'PY'
          from pathlib import Path
          import re, html
          s=Path('/tmp/status.html').read_text(encoding='utf-8')
          m=re.search(r'<pre>(.*?)</pre>', s, re.S|re.I)
          if not m:
              raise SystemExit('pre block not found')
          text=html.unescape(m.group(1)).strip()+"\n"
          Path('numbering-verification-result.txt').write_text(text, encoding='utf-8')
          print(text)
          PY
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add numbering-verification-result.txt
          git commit -m "Capture production numbering verification result"
          git push
