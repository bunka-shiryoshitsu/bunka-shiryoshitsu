name: Promote Worker to Production

on:
  workflow_dispatch:
    inputs:
      version_id:
        description: 'Cloudflare Worker Version ID to promote (full UUID)'
        required: true
        type: string
      confirmation:
        description: 'Type PRODUCTION to confirm 100% traffic promotion'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bunka-shiryoshitsu-production
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ inputs.confirmation == 'PRODUCTION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate version ID
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${{ inputs.version_id }}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo 'Invalid Cloudflare Worker Version ID.' >&2
            exit 1
          fi

      - name: Promote exact version to 100% Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN repository secret.' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID repository secret.' >&2; exit 1; }
          npx --yes wrangler@4.132.0 versions deploy "${{ inputs.version_id }}@100%" \
            --name bunka-shiryoshitsu-checksoft-mountain-b5a9 \
            --message "Manual production promotion from GitHub Actions"

      - name: Verify public Worker responds
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 \
            'https://bunka-shiryoshitsu-checksoft-mountain-b5a9.08084947685jddhdj.workers.dev/' >/dev/null
