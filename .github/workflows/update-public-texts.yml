name: Update public texts

on:
  push:
    paths:
      - 'scripts/update_public_texts.py'
      - '.github/workflows/update-public-texts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply text-only changes
        run: python scripts/update_public_texts.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update public guidance and bilingual action labels"
            git push
          fi
