name: Recover Worker core

on:
  push:
    paths:
      - '.github/workflows/recover-worker-core.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore core and break circular import
        shell: bash
        run: |
          set -euo pipefail
          git show cbaccea472489bdd7ed2629c24e134562167f11e:worker.js > worker-core.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('worker-entry.js')
          s = p.read_text(encoding='utf-8')
          old = 'import core from "./worker.js";'
          new = 'import core from "./worker-core.js";'
          if old not in s:
              raise SystemExit('expected worker.js core import was not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          node --check worker-core.js
          node --check worker-entry.js
          grep -F 'import core from "./worker-core.js";' worker-entry.js
          rm -f .github/workflows/recover-worker-core.yml

      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore Worker core and remove circular import"
          git push
